name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: [fehler]
body:
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Einstellungen → Version (bzw. Start-Banner im Log)
  - type: dropdown
    id: betrieb
    attributes:
      label: Betrieb
      options:
        - OpenLitBase Cloud
        - Auf dem eigenen Rechner (ohne Login)
        - Eigener Server (mit Login)
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      multiple: true
      options:
        - Web-App
        - Word-Add-in
        - Browser-Extension
        - Installation / Betrieb
  - type: textarea
    id: mehr
    attributes:
      label: Weitere Angaben
      description: Browser, Betriebssystem, Screenshots, Log-Auszüge (ohne persönliche Daten).
