# Baut das Docker-Image bei jedem Versions-Tag (v0.8.0 …) für amd64 und arm64 und legt es unter
# ghcr.io/max1302p/openlitbase ab – die Installer auf get.openlitbase.de ziehen es von dort.
name: Docker-Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/max1302p/openlitbase
          # v0.8.0 → 0.8.0, 0.8 und latest; manuell gestartet → Branch-Name.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=OpenLitBase
            org.opencontainers.image.description=Offene Literaturverwaltung
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
